name: Build main container

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: main-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute immutable image tag
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: APP_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote current main image
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping promotion: ${GITHUB_SHA} is no longer the main branch head."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "${image}:main" "${image}@${DIGEST}"
          echo "Promoted ${GITHUB_SHA} (${DIGEST}) to ${image}:main"
