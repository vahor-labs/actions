name: Build PR container and await preview

on:
  workflow_call:
    inputs:
      preview-prefix:
        description: Preview DNS prefix; defaults to the normalized repository name
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  building:
    name: Update preview comment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: vahor-labs/actions/.github/actions/preview-status@main
        with:
          phase: building
          preview-prefix: ${{ inputs.preview-prefix }}

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out actual PR head (not merge commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Compute immutable image tag
        id: image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:pr-${PR_NUMBER}-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verification:
    name: Wait for preview
    needs: [building, build]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.building.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - uses: vahor-labs/actions/.github/actions/preview-status@main
        with:
          phase: ${{ needs.build.result == 'success' && 'deploying' || 'failed' }}
          preview-prefix: ${{ inputs.preview-prefix }}
