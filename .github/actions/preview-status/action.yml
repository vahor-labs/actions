name: PR preview status
description: Maintain one bot comment and check the commit-specific preview route
inputs:
  phase:
    description: building, deploying (label and poll), or failed
    required: true
  preview-prefix:
    description: Preview DNS prefix; defaults to the normalized repository name (vahor.fr becomes vahor-fr)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        PREVIEW_ACTION_PATH: ${{ github.action_path }}
        PREVIEW_PHASE: ${{ inputs.phase }}
        PREVIEW_PREFIX: ${{ inputs.preview-prefix }}
      with:
        script: |
          const { run } = require(`${process.env.PREVIEW_ACTION_PATH}/status.cjs`);
          await run({ github, context, core, phase: process.env.PREVIEW_PHASE, previewPrefix: process.env.PREVIEW_PREFIX });
