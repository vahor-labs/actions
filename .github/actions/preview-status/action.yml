name: PR preview status
description: Maintain one bot comment and verify the public deployment SHA
inputs:
  phase:
    description: building, deploying (label and poll), or failed
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        PREVIEW_ACTION_PATH: ${{ github.action_path }}
        PREVIEW_PHASE: ${{ inputs.phase }}
      with:
        script: |
          const { run } = require(`${process.env.PREVIEW_ACTION_PATH}/status.cjs`);
          await run({ github, context, core, phase: process.env.PREVIEW_PHASE });
